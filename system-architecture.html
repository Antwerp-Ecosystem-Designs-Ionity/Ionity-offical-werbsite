    <style>
        :root {
            --bg-dark: #020204;
            --bg-panel: rgba(10, 15, 20, 0.6);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.85); 
            --accent-cyan: #00d2ff;
            --accent-blue: #2979ff;
            --accent-dim: rgba(0, 210, 255, 0.1);
            --border: rgba(255, 255, 255, 0.15);
            --border-active: rgba(0, 210, 255, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
        }

        /* --- 3D CANVAS BACKGROUND --- */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; 
            pointer-events: none;
        }

        /* --- ONTOP GUI OVERLAY --- */
        #ontop-gui {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        .gui-corner {
            position: absolute;
            width: 15rem; height: 15rem;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3), inset 0 0 10px rgba(0, 210, 255, 0.1);
            pointer-events: none;
        }
        .gui-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .gui-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; text-align: right; }
        .gui-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; display: flex; align-items: flex-end;}
        .gui-br { bottom: 20px; right: 20px; border-left: none; border-top: none; text-align: right; display: flex; align-items: flex-end; justify-content: flex-end;}
        
        .gui-text {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(0, 160, 200, 0.8); /* Darker Cyan */
            padding: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            opacity: 0.9;
            text-shadow: 0 0 2px rgba(0, 160, 200, 0.2);
        }

        /* --- VISUAL FX --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
            opacity: 0.3;
        }

        /* --- GLOW ANIMATIONS --- */
        @keyframes neonPulse {
            0% { text-shadow: 0 0 5px rgba(255,255,255,0.8), 0 0 10px var(--accent-cyan); }
            50% { text-shadow: 0 0 10px #fff, 0 0 20px var(--accent-cyan), 0 0 30px var(--accent-cyan); }
            100% { text-shadow: 0 0 5px rgba(255,255,255,0.8), 0 0 10px var(--accent-cyan); }
        }

        @keyframes flashGlow {
            0% { text-shadow: 0 0 0 transparent; }
            50% { text-shadow: 0 0 20px #fff, 0 0 40px var(--accent-cyan); color: #fff; }
            100% { text-shadow: 0 0 10px rgba(0,0,0,0.5); color: #fff; }
        }

        /* --- NAVIGATION --- */
        nav {
            padding: 0 5vw;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(2, 2, 4, 0.9);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            box-sizing: border-box;
            z-index: 1001;
            transition: all 0.3s ease;
        }
        
        /* Spacer for content below fixed nav */
        nav + * { margin-top: 80px; }

        /* Desktop: Add 3 extra lines of spacing for web only */
        @media (min-width: 769px) {
            .container {
                margin-top: 7rem;
            }
        }

        .logo {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 0.2rem;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            position: relative;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            transition: all 0.3s;
        }
        
        .logo:hover {
            animation: neonPulse 1.5s infinite alternate;
        }
        
        .logo::after {
            content: '_';
            animation: blink 1s infinite;
        }

        .nav-logo {
            height: 80px;
            width: auto;
            vertical-align: middle;
            transition: all 0.3s ease;
        }
        .nav-logo:hover {
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        /* Desktop Nav */
        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #fff;
            animation: neonPulse 1s infinite alternate;
        }

        .nav-links a.active {
            color: var(--accent-cyan);
            /* Permanent subtle glow for active tab */
            text-shadow: 0 0 15px var(--accent-cyan); 
            border-bottom: 1px solid var(--accent-cyan);
        }

        .nav-links a::before { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: var(--accent-cyan); transition: width 0.3s ease; box-shadow: 0 0 10px var(--accent-cyan); }

    </style>
</head>
